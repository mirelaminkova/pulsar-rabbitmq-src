---
# Pulsar in message-queue mode: it consumes job messages from RabbitMQ on this
# workspace over 127.0.0.1 with the pair account, so no credentials are copied.
- name: Install Python venv support for Pulsar
  ansible.builtin.apt:
    name: [python3-venv, python3-dev, build-essential]
    state: present
    update_cache: true

- name: Create the Pulsar system user
  ansible.builtin.user:
    name: "{{ pulsar_user }}"
    system: true
    home: "{{ _pulsar_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ ['docker'] if pulsar_docker | bool else omit }}"
    append: true

- name: Create Pulsar directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ pulsar_venv | dirname }}", owner: root, mode: '0755'}
    - {path: "{{ pulsar_config_dir }}", owner: root, mode: '0755'}
    - {path: "{{ _pulsar_root }}", owner: "{{ pulsar_user }}", mode: '0750'}
    - {path: "{{ pulsar_staging_dir }}", owner: "{{ pulsar_user }}", mode: '0750'}
    - {path: "{{ pulsar_persistence_dir }}", owner: "{{ pulsar_user }}", mode: '0750'}

# No `creates:`, so a version change in group_vars upgrades the venv.
# The amqp extra installs kombu, which Pulsar needs for amqp:// message queues.
- name: Install pulsar-app with AMQP support into the venv
  ansible.builtin.pip:
    name:
      - "pulsar-app[amqp]=={{ pulsar_version }}"
      - psutil
    virtualenv: "{{ pulsar_venv }}"
    # Absolute path: SRC runs Ansible through `uv run`, whose own python3 may
    # come first on PATH and is not usable by the pulsar system user.
    virtualenv_command: /usr/bin/python3 -m venv
  notify: Restart Pulsar

- name: Write Pulsar's app.yml with the RabbitMQ connection
  ansible.builtin.template:
    src: templates/pulsar-app.yml.j2
    dest: "{{ pulsar_config_dir }}/app.yml"
    owner: root
    group: "{{ pulsar_user }}"
    mode: '0640'
  vars:
    _rabbitmq_pair_password: "{{ (_rabbitmq_secrets_file.content | b64decode | from_json).RABBITMQ_PAIR_PASSWORD }}"
  no_log: true
  diff: false
  notify: Restart Pulsar

- name: Write Pulsar's logging configuration
  ansible.builtin.copy:
    src: templates/pulsar-server.ini
    dest: "{{ pulsar_config_dir }}/server.ini"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pulsar

- name: Write Pulsar's job metrics configuration
  ansible.builtin.copy:
    dest: "{{ pulsar_config_dir }}/job_metrics_conf.xml"
    owner: root
    group: root
    mode: '0644'
    content: |
      <?xml version="1.0"?>
      <job_metrics>
          <core />
          <cpuinfo />
          <meminfo />
          <hostname />
      </job_metrics>
  notify: Restart Pulsar

- name: Install Apptainer for Singularity-enabled Galaxy environments
  ansible.builtin.include_tasks: tasks/apptainer.yml
  when: pulsar_apptainer | bool

# autofs mounts a repository on first access; this proves the client works
# (keys, stratum 1 reachable) before Galaxy's first job depends on it.
- name: Check that the Galaxy CVMFS repositories mount
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _pulsar_cvmfs_repositories
  failed_when: not _pulsar_cvmfs_repositories.stat.exists
  loop:
    - /cvmfs/data.galaxyproject.org/managed/location/tool_data_table_conf.xml
    - /cvmfs/singularity.galaxyproject.org/all
  when: _pulsar_cvmfs | bool

- name: Install the Pulsar systemd unit
  ansible.builtin.template:
    src: templates/pulsar.service.j2
    dest: /etc/systemd/system/pulsar.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pulsar

- name: Enable and start Pulsar
  ansible.builtin.systemd:
    name: pulsar
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending Pulsar restarts before checking the connection
  ansible.builtin.meta: flush_handlers

# Pulsar declares and consumes <prefix>_setup, _kill and _status on the "pulsar"
# exchange when it binds to RabbitMQ; a consumer on the setup queue proves that
# Pulsar logged in with the pair account and is waiting for Galaxy's jobs.
- name: Wait until Pulsar consumes its setup queue
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ rabbitmq_management_port }}{{ _api_prefix }}/api/queues/{{ rabbitmq_vhost | urlencode }}/{{ _pulsar_setup_queue | urlencode }}"
    url_username: "{{ rabbitmq_admin_username }}"
    url_password: "{{ (_rabbitmq_secrets_file.content | b64decode | from_json).RABBITMQ_ADMIN_PASSWORD }}"
    force_basic_auth: true
    status_code: [200, 404]
  vars:
    _api_prefix: "{{ rabbitmq_management_path if rabbitmq_management_ui | bool else '' }}"
  register: _pulsar_setup_queue_state
  until: >-
    _pulsar_setup_queue_state.status == 200 and
    (_pulsar_setup_queue_state.json.consumers | default(0) | int) > 0
  retries: 24
  delay: 5
  no_log: true
