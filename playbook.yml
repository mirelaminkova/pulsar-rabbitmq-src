---
- name: Install a BYOC Pulsar for a Galaxy's RabbitMQ on SURF Research Cloud
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}"
  become: true
  # Restart Pulsar for a changed app.yml or venv even when a later task fails; a rerun
  # would not see the change again and would leave the old Pulsar running.
  force_handlers: true
  pre_tasks:
    # byoc-sync's rules, in filter_plugins/pulsar_amqp.py; an empty name or password is
    # generated below.
    - name: Validate the component parameters
      ansible.builtin.assert:
        that: _pulsar_amqp_errors | length == 0
        fail_msg: "Check the component parameters: {{ _pulsar_amqp_errors | join('; ') }}"
        quiet: true

    # Ignored since pulsar_storage_path replaced it; a catalog item may still set it.
    - name: Refuse the replaced staging directory parameter
      ansible.builtin.assert:
        that: pulsar_staging_dir | default('', true) | length == 0
        fail_msg: >-
          pulsar_staging_dir is replaced by pulsar_storage_path (staging is
          <pulsar_storage_path>/staging): remove it from the catalog item and set
          pulsar_storage_path to an attached storage volume's mount point,
          /data/<volume name>, or a directory on it.
        quiet: true

    - name: Check supported workspace OS
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] in ['22.04', '24.04']
        fail_msg: Choose an Ubuntu 22.04 or 24.04 SRC workspace.

    # The slurm-drmaa PPA builds amd64 only.
    - name: Check that the Slurm runner can be installed
      ansible.builtin.assert:
        that: ansible_facts['architecture'] == 'x86_64' or not _pulsar_slurm | bool
        fail_msg: >-
          pulsar_job_runner slurm needs an x86_64 workspace (slurm-drmaa has no
          {{ ansible_facts['architecture'] }} packages); choose pulsar_job_runner local.
        quiet: true

    # Before the roles (Docker's data-root is on it) and Pulsar.
    - name: Check and prepare the attached storage
      ansible.builtin.include_tasks: tasks/storage.yml

    # On the storage, so after it: from here on _pulsar_amqp has the name and password.
    - name: Load or create this Pulsar's BYOC credentials
      ansible.builtin.include_tasks: tasks/credentials.yml

    - name: Check SRC nginx prerequisite
      ansible.builtin.stat:
        path: /etc/nginx/app-location-conf.d/authentication.conf
      register: _pulsar_nginx_prerequisite
      when: pulsar_configure_src_proxy | bool

    - name: Require SRC-Nginx for the SRAM-protected welcome page
      ansible.builtin.assert:
        that: _pulsar_nginx_prerequisite.stat.exists
        fail_msg: Add SRC-Nginx before this component in the catalog item.
      when: pulsar_configure_src_proxy | bool

  roles:
    # Docker Engine for docker_enabled Galaxy environments.
    - role: geerlingguy.docker
      when: _pulsar_amqp.docker_enabled
      # CI's live Slurm check uses the runner's own Docker.
      tags: [docker-install]
    # Galaxy's CVMFS repositories (reference data under /cvmfs), with the same role
    # and settings as the SRC Galaxy component.
    - role: galaxyproject.cvmfs
      when: _pulsar_cvmfs | bool

  tasks:
    - name: Prepare the SRAM-protected welcome page
      when: pulsar_configure_src_proxy | bool
      block:
        - name: Create the welcome page directory
          ansible.builtin.file:
            path: "{{ pulsar_welcome_dir }}"
            state: directory
            owner: root
            group: www-data
            mode: '0750'

        - name: Configure the SRC HTTPS reverse proxy for the welcome page
          ansible.builtin.include_role:
            name: uusrc.general.nginx_reverse_proxy

    # Before Pulsar, whose queued_drmaa manager needs Slurm and its DRMAA library.
    - name: Run Pulsar's jobs through Slurm on this workspace
      ansible.builtin.include_tasks: tasks/slurm.yml
      when: _pulsar_slurm | bool

    # The welcome page is written once per run, after the broker check recorded the
    # connection state (_pulsar_byoc_state), and also when the installation or the check
    # failed: the BYOC form is then still available.
    - name: Install Pulsar and publish the welcome page with its connection state
      block:
        - name: Install Pulsar and connect it to Galaxy's RabbitMQ
          ansible.builtin.include_tasks: tasks/pulsar.yml
      always:
        - name: Template the welcome page with the BYOC form and the connection state
          ansible.builtin.template:
            src: templates/welcome.html.j2
            dest: "{{ pulsar_welcome_dir }}/index.html"
            owner: root
            group: www-data
            mode: '0640'
          when: pulsar_configure_src_proxy | bool
          no_log: true
          diff: false

    # After Pulsar has switched to queued_python. Switch without active jobs: Pulsar
    # cannot move them between managers, and Galaxy would see them as lost.
    - name: Stop Slurm when Pulsar runs jobs itself
      ansible.builtin.include_tasks: tasks/slurm-off.yml
      when: not _pulsar_slurm | bool

  handlers:
    - name: Reload systemd units
      ansible.builtin.systemd:
        daemon_reload: true

    # Notified in pre_tasks, so it runs before the roles; Docker not yet installed
    # starts on the storage by itself.
    - name: Restart an installed Docker onto the storage
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: true
      when: _pulsar_dockerd.stat.exists | default(false)

    - name: Restart Pulsar
      ansible.builtin.systemd:
        name: pulsar
        state: restarted
        daemon_reload: true
