---
name: Validate component
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  # pytest (unit, contract and Pulsar compatibility tests) runs in checks.yml.
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tooling (ansible-core)
        run: python -m pip install -r requirements-dev.txt
      - name: Install Ansible dependencies
        run: ansible-galaxy install -r requirements.yml
      - name: Validate Ansible syntax
        run: ansible-playbook -i localhost, playbook.yml --syntax-check

  # The vendored Galaxy parser and template (tests/galaxy_contract/) must still be the
  # Galaxy component's: a failure here means the contract changed upstream.
  galaxy-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Galaxy component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mirelaminkova/src-component-galaxy-amqp
          path: .galaxy-amqp
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt
      # --no-cov: one test module cannot reach the coverage gate, which checks.yml enforces.
      # The comparison must run here, never skip: fail on any SKIPPED.
      - name: Compare the vendored contract files with the Galaxy component
        shell: bash  # explicit bash runs with -eo pipefail: tee cannot hide a failure
        env:
          GALAXY_AMQP_REPO: .galaxy-amqp
        run: |
          pytest tests/test_galaxy_contract.py --no-cov -v -rs | tee "$RUNNER_TEMP/contract.log"
          ! grep -q SKIPPED "$RUNNER_TEMP/contract.log"
