---
# This Pulsar's BYOC name and password (RabbitMQ user galaxy_<name>_byoc): the component
# parameters when given, else the ones stored on the storage volume by an earlier run, else
# new ones. Runs in pre_tasks, after tasks/storage.yml created the root-owned storage
# directory. files/byoc_credentials.py does the work, as root, with the values on stdin
# (never on a command line) and in isolated mode, from the root-only directory of the
# storage check. Installed in check mode too (a root-owned script, like the storage check
# itself), since the helper runs in check mode below.
- name: Install the BYOC credentials helper
  ansible.builtin.copy:
    src: files/byoc_credentials.py
    dest: "{{ pulsar_byoc_script }}"
    owner: root
    group: root
    mode: '0755'
  check_mode: false

# The password passes through this task: no_log, also for a failure, which the next task
# reports from the helper's message (it never contains a value). Runs in check mode too,
# with --no-write: the settings below need the credentials. `| string`: a parameter from a
# YAML file may be a number, which the helper would refuse.
- name: Load or create the BYOC name and password
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-I', pulsar_byoc_script, pulsar_byoc_store]
         + (['--no-write'] if ansible_check_mode else []) }}
    stdin: "{{ {'name': pulsar_amqp_name | string, 'password': pulsar_amqp_password | string} | to_json }}"
  register: _pulsar_byoc
  changed_when: _pulsar_byoc.rc == 0 and (_pulsar_byoc.stdout | from_json).changed
  failed_when: false
  check_mode: false
  no_log: true

- name: Fail when the BYOC credentials cannot be loaded or created
  ansible.builtin.fail:
    msg: "{{ _pulsar_byoc.stderr | default('', true) | trim }} {{ _pulsar_byoc.msg | default('', true) }}"
  when: _pulsar_byoc.rc | default(1) != 0

# From here on, _pulsar_amqp (and everything derived from it) has the resolved credentials.
- name: Derive the connection settings from the credentials
  ansible.builtin.set_fact:
    _pulsar_amqp: >-
      {{ _pulsar_amqp_params | combine({'name': _creds.name, 'password': _creds.password})
         | pulsar_amqp_settings }}
  vars:
    _creds: "{{ _pulsar_byoc.stdout | from_json }}"
  no_log: true

# The helper refuses a bad store and bad given values; this is the same check on the result,
# after set_fact. The messages never contain the password.
- name: Validate the resolved credentials
  ansible.builtin.assert:
    that: _pulsar_amqp | pulsar_amqp_errors | length == 0
    fail_msg: "Check the BYOC credentials: {{ _pulsar_amqp | pulsar_amqp_errors | join('; ') }}"
    quiet: true
