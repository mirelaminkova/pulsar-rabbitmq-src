---
# Pulsar as an AMQP client of the Galaxy component's RabbitMQ, webless, modelled on
# usegalaxy-eu/pulsar-nemo-login-role with systemd instead of supervisord.
- name: Install Python venv support for Pulsar
  ansible.builtin.apt:
    name: [python3-venv, python3-dev, build-essential, ca-certificates]
    state: present
    update_cache: true

- name: Create the Pulsar system user
  ansible.builtin.user:
    name: "{{ pulsar_user }}"
    system: true
    home: "{{ pulsar_passwd_home }}"
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ ['docker'] if _pulsar_amqp.docker_enabled else omit }}"
    # ansible-core 2.20+ refuses append without groups.
    append: "{{ true if _pulsar_amqp.docker_enabled else omit }}"
  register: _pulsar_user

# Every directory the pulsar user owns sits in a root-owned one (the storage directory,
# created by tasks/storage.yml), and links are not followed:
# otherwise a job could swap a directory for a link to, say, the venv, and the next
# run (as root) would hand that to the pulsar user.
- name: Create root-owned Pulsar directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
    follow: false
  loop:
    - "{{ pulsar_venv | dirname }}"
    - "{{ pulsar_config_dir }}"

# A volume from an earlier workspace (or a rerun after the user was recreated) holds
# files of another pulsar uid or gid (root's files stay root's). Before the directories
# are created (which would re-own their tops), coreutils hands over exactly the old
# owner's files: it walks by file descriptor without following links and changes
# directories last, so neither a concurrent rename nor an interrupted run can redirect
# or hide the handover.
- name: Find Pulsar data from an earlier workspace
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: "{{ _pulsar_owned_dirs }}"
  register: _pulsar_reused

# Pulsar's own processes stop changing the tree while it is handed over. Slurm jobs of
# a user recreated on a running workspace are not stopped: files they write meanwhile
# keep the old owner (README: let jobs finish first). Restarted by the handler even
# when a later task fails (force_handlers).
- name: Stop Pulsar before handing over reused data
  ansible.builtin.command:
    argv: [systemctl, stop, pulsar.service]
  register: _pulsar_stop
  # 5: no such unit yet (a new workspace).
  failed_when: _pulsar_stop.rc not in [0, 5]
  changed_when: _pulsar_stop.rc == 0
  when: _pulsar_handover | length > 0
  notify: Restart Pulsar

- name: Give reused Pulsar data of another uid to the pulsar user
  ansible.builtin.command:
    argv:
      - chown
      - --recursive
      - --no-dereference
      - "--from={{ item.stat.uid }}"
      - "{{ pulsar_user }}:{{ pulsar_user }}"
      - "{{ item.item }}"
  changed_when: true
  loop: "{{ _pulsar_reused.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isdir and item.stat.uid not in [0, _pulsar_user.uid | default(-1)]

- name: Give reused Pulsar data of another gid to the pulsar group
  ansible.builtin.command:
    argv:
      - chown
      - --recursive
      - --no-dereference
      - "--from=:{{ item.stat.gid }}"
      - ":{{ pulsar_user }}"
      - "{{ item.item }}"
  changed_when: true
  loop: "{{ _pulsar_reused.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isdir and item.stat.gid not in [0, _pulsar_user.group | default(-1)]

- name: Create Pulsar's working directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pulsar_user }}"
    group: "{{ pulsar_user }}"
    mode: '0750'
    follow: false
  loop: "{{ _pulsar_owned_dirs }}"

# No `creates:`, so a version change in group_vars upgrades the venv.
# The amqp extra installs kombu, which Pulsar needs for pyamqp:// message queues.
- name: Install pulsar-app with AMQP support into the venv
  ansible.builtin.pip:
    name:
      - "pulsar-app[amqp]=={{ pulsar_version }}"
      - psutil
      # For the queued_drmaa manager (pulsar_job_runner: slurm).
      - "drmaa=={{ pulsar_drmaa_version }}"
    virtualenv: "{{ pulsar_venv }}"
    # Absolute path: SRC runs Ansible through `uv run`, whose own python3 may
    # come first on PATH and is not usable by the pulsar system user.
    virtualenv_command: /usr/bin/python3 -m venv
  notify: Restart Pulsar

- name: Write Pulsar's app.yml with the Galaxy broker connection
  ansible.builtin.template:
    src: templates/pulsar-app.yml.j2
    dest: "{{ pulsar_config_dir }}/app.yml"
    owner: root
    group: "{{ pulsar_user }}"
    mode: '0640'
  no_log: true
  diff: false
  notify: Restart Pulsar

- name: Write Pulsar's logging configuration
  ansible.builtin.copy:
    src: templates/pulsar-server.ini
    dest: "{{ pulsar_config_dir }}/server.ini"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pulsar

- name: Write Pulsar's job metrics configuration
  ansible.builtin.copy:
    dest: "{{ pulsar_config_dir }}/job_metrics_conf.xml"
    owner: root
    group: root
    mode: '0644'
    content: |
      <?xml version="1.0"?>
      <job_metrics>
          <core />
          <cpuinfo />
          <meminfo />
          <hostname />
      </job_metrics>
  notify: Restart Pulsar

- name: Install the broker connection check
  ansible.builtin.copy:
    src: files/check_amqp.py
    dest: "{{ pulsar_check_script }}"
    owner: root
    group: root
    mode: '0755'

# Before the tasks that can fail: force_handlers then restarts an existing unit.
- name: Install the Pulsar systemd unit
  ansible.builtin.template:
    src: templates/pulsar.service.j2
    dest: /etc/systemd/system/pulsar.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pulsar

- name: Install Apptainer for Singularity-enabled Galaxy environments
  ansible.builtin.include_tasks: tasks/apptainer.yml
  when: _pulsar_amqp.singularity_enabled

# autofs mounts a repository on first access; this proves the client works
# (keys, stratum 1 reachable) before Galaxy's first job depends on it.
- name: Check that the Galaxy CVMFS repositories mount
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _pulsar_cvmfs_repositories
  failed_when: not _pulsar_cvmfs_repositories.stat.exists
  loop:
    - /cvmfs/data.galaxyproject.org/managed/location/tool_data_table_conf.xml
  when: _pulsar_cvmfs | bool

- name: Enable and start Pulsar
  ansible.builtin.systemd:
    name: pulsar
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending Pulsar restarts before checking the connection
  ansible.builtin.meta: flush_handlers

# Pulsar declares and consumes its setup queue when it has logged in; a consumer
# on it proves the login, the vhost and the TLS settings. Exit status 75 means
# "not yet" and is retried (about two minutes); any other failure stops at once.
- name: Check that Pulsar consumes its setup queue on Galaxy's broker
  ansible.builtin.command:
    argv:
      - "{{ pulsar_venv }}/bin/python"
      - "{{ pulsar_check_script }}"
      - "{{ pulsar_config_dir }}/app.yml"
  register: _pulsar_amqp_check
  until: _pulsar_amqp_check.rc != 75
  retries: 24
  delay: 5
  changed_when: false
  failed_when: false
  # CI's live Slurm check has no Galaxy broker and skips these two.
  tags: [broker-check]

- name: Fail when Pulsar cannot use Galaxy's broker
  ansible.builtin.fail:
    msg: "{{ _pulsar_amqp_check.stdout | default('', true) }} {{ _pulsar_amqp_check.stderr | default('', true) | trim }}"
  when: _pulsar_amqp_check.rc != 0
  tags: [broker-check]
