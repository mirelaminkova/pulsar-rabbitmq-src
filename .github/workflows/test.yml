---
name: Validate component
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (Pulsar, ansible-core)
        run: python -m pip install -r tests/requirements.txt
      - name: Unit, contract and Pulsar compatibility tests
        run: python -m unittest discover -s tests -t . -v
      - name: Install Ansible dependencies
        run: ansible-galaxy install -r requirements.yml
      - name: Validate Ansible syntax
        run: ansible-playbook -i localhost, playbook.yml --syntax-check

  # The vendored Galaxy parser and template (tests/galaxy_contract/) must still be the
  # Galaxy component's: a failure here means the contract changed upstream.
  galaxy-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Galaxy component
        uses: actions/checkout@v4
        with:
          repository: mirelaminkova/src-component-galaxy-amqp
          path: .galaxy-amqp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Compare the vendored contract files with the Galaxy component
        env:
          GALAXY_AMQP_REPO: .galaxy-amqp
        run: python -m unittest tests.test_galaxy_contract -v
