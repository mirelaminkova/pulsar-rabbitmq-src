---
# --- Component parameters: one-to-one with the Galaxy component's entry ---------
# (mirelaminkova/src-component-galaxy-amqp, src_galaxy_pulsar_amqp_configs). SRC
# passes unset parameters as empty strings; empty values get Galaxy's defaults.
# Galaxy workspace hostname (Galaxy's workspace_fqdn): the broker unless pulsar_amqp_host
# is set, and the Galaxy the welcome page names.
pulsar_galaxy_fqdn: ""
# The RabbitMQ host, as in its TLS certificate. Empty: the Galaxy host, where the Galaxy
# component runs RabbitMQ. usegalaxy.eu's Pulsar Network has its own, mq.galaxyproject.eu.
pulsar_amqp_host: ""
# Galaxy's src_galaxy_rabbitmq_port (AMQPS).
pulsar_amqp_port: 5671
# This Pulsar's `name` in src_galaxy_pulsar_amqp_configs: RabbitMQ user <name>,
# vhost /pulsar/<name>, Galaxy environment amqp_<name>.
pulsar_amqp_name: ""
# The entry's `password` (or the one Galaxy generated, in
# /etc/galaxy-rabbitmq/pulsar_<name>.txt on the Galaxy workspace). Secret.
pulsar_amqp_password: ""
# The entry's `manager`.
pulsar_manager: _default_
# The workspace's attached storage volume, which SRC mounts at /data/<volume name>: that
# mount point (Pulsar then uses /data/<volume name>/pulsar) or a directory on it. Required.
# All of Pulsar's data lives in that storage directory, including staging, the entry's
# `jobs_directory` (<storage directory>/staging).
pulsar_storage_path: ""
# Mount the Galaxy project's CVMFS repositories under /cvmfs (reference data for
# Galaxy's tool data tables), as the Galaxy component does with src_galaxy_cvmfs.
pulsar_cvmfs: true
# Install Apptainer (with its `singularity` command), unprivileged (no setuid
# starter); the welcome page's Galaxy entry then sets singularity_enabled.
pulsar_apptainer: true
# Install Docker for docker_enabled Galaxy environments (the entry sets it only
# without Apptainer). Off by default: the pulsar user joins the docker group,
# which is equivalent to root on this workspace.
pulsar_docker: false
# Where Pulsar runs Galaxy's jobs: "slurm" submits them through DRMAA to a
# single-node Slurm on this workspace (Pulsar manager type queued_drmaa); "local"
# runs them in Pulsar itself (queued_python). Galaxy sees no difference.
pulsar_job_runner: slurm
# Seconds after which Pulsar republishes a status update Galaxy has not acknowledged
# (amqp_ack_republish_time): 1200 for the Galaxy component's runner, 300 for usegalaxy.eu's.
pulsar_amqp_ack_republish_time: 1200

# --- Derived settings; use these, never the parameters directly ---------------
_pulsar_amqp: >-
  {{ {'galaxy_fqdn': pulsar_galaxy_fqdn, 'host': pulsar_amqp_host,
      'port': pulsar_amqp_port, 'name': pulsar_amqp_name,
      'password': pulsar_amqp_password, 'manager': pulsar_manager,
      'storage_path': pulsar_storage_path, 'docker_enabled': pulsar_docker,
      'singularity_enabled': pulsar_apptainer, 'cvmfs': pulsar_cvmfs,
      'job_runner': pulsar_job_runner,
      'ack_republish_time': pulsar_amqp_ack_republish_time}
     | pulsar_amqp_settings }}
_pulsar_amqp_errors: "{{ _pulsar_amqp | pulsar_amqp_errors }}"
_pulsar_cvmfs: "{{ _pulsar_amqp.cvmfs }}"
_pulsar_slurm: "{{ _pulsar_amqp.job_runner == 'slurm' }}"

# --- Pulsar ------------------------------------------------------------------
pulsar_user: pulsar
# Pulsar's data on the attached storage (root-owned pulsar_storage_path), each directory
# owned by the pulsar user. Staging is _pulsar_amqp.jobs_directory (<path>/staging).
# HOME of Pulsar and its jobs (from the unit and the task prolog), and Pulsar's working
# directory: Pulsar's own jobs keep only HOME, PATH and TMPDIR of the unit's
# environment, so what they keep under ~ (Apptainer's cache, Pulsar's tool
# dependencies) is on the storage through HOME.
pulsar_home: "{{ _pulsar_amqp.storage_path }}/home"
# The home in /etc/passwd never changes: usermod refuses while the user has processes
# (a running Pulsar or Slurm job), so a new storage path would fail the deployment.
pulsar_passwd_home: /var/lib/pulsar/home
pulsar_persistence_dir: "{{ _pulsar_amqp.storage_path }}/persisted_data"
pulsar_apptainer_cache_dir: "{{ _pulsar_amqp.storage_path }}/apptainer_cache"
pulsar_apptainer_tmp_dir: "{{ _pulsar_amqp.storage_path }}/apptainer_tmp"
# Jobs' temporary files (TMPDIR); a directory per job under Slurm (task prolog).
pulsar_job_tmp_dir: "{{ _pulsar_amqp.storage_path }}/job_tmp"
# The directories the pulsar user owns, each in a root-owned one.
_pulsar_owned_dirs: >-
  {{ [pulsar_home, pulsar_persistence_dir, _pulsar_amqp.jobs_directory, pulsar_job_tmp_dir]
     + ([pulsar_apptainer_cache_dir, pulsar_apptainer_tmp_dir]
        if _pulsar_amqp.singularity_enabled else []) }}
# Units that write to the storage and so start only with it (tasks/storage.yml).
_pulsar_storage_units:
# Docker keeps its own Restart=always; slurmd's spool directory is created if missing.
  - unit: docker
    enabled: "{{ _pulsar_amqp.docker_enabled }}"
    option: "--docker "
    service: [RestartSec=10]
  - unit: slurmd
    enabled: "{{ _pulsar_slurm | bool }}"
    option: ""
    service:
      - "ExecStartPre=/usr/bin/mkdir -p {{ pulsar_slurmd_spool_dir }}"
      - Restart=on-failure
      - RestartSec=10
# Of the pulsar user's directories found by tasks/pulsar.yml, those with files of
# another (non-root) owner or group to hand over: data from an earlier workspace.
_pulsar_handover: >-
  {%- set ns = namespace(dirs=[]) -%}
  {%- for found in (_pulsar_reused | default({})).results | default([]) -%}
  {%- if found.stat.exists and found.stat.isdir
        and (found.stat.uid not in [0, _pulsar_user.uid | default(-1)]
             or found.stat.gid not in [0, _pulsar_user.group | default(-1)]) -%}
  {%- set ns.dirs = ns.dirs + [found.item] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.dirs }}
# slurmd's spool (job scripts and the state of running jobs), root's; Slurm's
# controller state (StateSaveLocation) stays on the root disk, as the role sets it.
pulsar_slurmd_spool_dir: "{{ _pulsar_amqp.storage_path }}/slurmd"
# Docker's own directory (root's, created by dockerd).
pulsar_docker_data_root: "{{ _pulsar_amqp.storage_path }}/docker"
pulsar_venv: /opt/pulsar/venv
pulsar_config_dir: /opt/pulsar/config
pulsar_check_script: /opt/pulsar/check_amqp.py
# files/check_storage.py, run as root before Pulsar, Docker and slurmd start; alone in its
# root-only directory, as Python 3.10's -I still puts the script's directory on sys.path.
pulsar_storage_check_script: /usr/local/libexec/pulsar-src/check_storage.py
pulsar_version: "0.15.15"
# Ubuntu's CA bundle: the broker's certificate (SRC-Nginx, Let's Encrypt or ZeroSSL on
# a Galaxy workspace) is verified against it, together with its hostname _pulsar_amqp.host.
pulsar_amqp_ca_certs: /etc/ssl/certs/ca-certificates.crt
# With pulsar_job_runner local: Pulsar runs this many jobs at once itself.
pulsar_num_concurrent_jobs: "{{ [ansible_facts['processor_vcpus'] | default(1) | int - 1, 1] | max }}"
# Python DRMAA binding in Pulsar's venv (installed for both runners) and the
# libdrmaa of slurm-drmaa1 it loads, through the unit's environment.
pulsar_drmaa_version: "0.7.9"
pulsar_drmaa_library_path: /usr/lib/slurm-drmaa/lib/libdrmaa.so.1
# Ubuntu has no slurm-drmaa since 16.04: the Galaxy project's PPA (natefoo), which
# galaxyproject.repos also adds, has it for 22.04 and 24.04.
slurm_drmaa_repo_url: https://ppa.launchpadcontent.net/natefoo/slurm-drmaa/ubuntu
slurm_drmaa_key_location: /usr/share/keyrings/slurm-drmaa.asc
# Launchpad's origin of that PPA: apt takes only slurm-drmaa packages from it.
slurm_drmaa_origin: LP-PPA-natefoo-slurm-drmaa

# --- Slurm (pulsar_job_runner: slurm), with galaxyproject.slurm ------------------
# One node: this workspace is controller and compute node, so no shared
# filesystem is needed and munge's own random key (generated when the package is
# installed) is the only one; none is shipped. Jobs run as the pulsar user.
slurm_roles: [controller, exec]
# Memory Slurm does not hand out to jobs, for the OS, Pulsar and its broker
# connection. Slurm schedules by it but does not enforce it (no cgroups).
# At least 1 GiB or a tenth, but never more than half of the workspace's memory.
pulsar_slurm_reserved_memory_mb: "{{ [1024, (ansible_facts['memtotal_mb'] | int) // 10] | max }}"
_pulsar_slurm_memory_mb: >-
  {{ [(ansible_facts['memtotal_mb'] | int) - (pulsar_slurm_reserved_memory_mb | int),
      (ansible_facts['memtotal_mb'] | int) - (ansible_facts['memtotal_mb'] | int) // 2] | max }}
_pulsar_slurm_cpus: "{{ ansible_facts['processor_vcpus'] | default(1) | int }}"
# slurmd falls back to the NodeName "localhost" when none matches the hostname,
# so the node does not depend on SRC's hostname.
slurm_nodes:
  - name: localhost
    CPUs: "{{ _pulsar_slurm_cpus }}"
    RealMemory: "{{ _pulsar_slurm_memory_mb }}"
    State: UNKNOWN
slurm_partitions:
  - name: pulsar
    Default: true
    Nodes: localhost
    MaxTime: INFINITE
    State: UP
# In the role's slurm_config_dir (/etc/slurm on Ubuntu 22.04 and 24.04).
pulsar_slurm_epilog: /etc/slurm/epilog.sh
# Slurm jobs run outside the pulsar unit: this sets their TMPDIR and Apptainer
# directories to the storage (templates/task_prolog.sh.j2).
pulsar_slurm_task_prolog: /etc/slurm/task_prolog.sh
# Removes the job's temporary directory after each job (templates/task_epilog.sh.j2).
pulsar_slurm_task_epilog: /etc/slurm/task_epilog.sh
# sinfo states in which the node starts jobs; the deployment waits for one.
_pulsar_slurm_ready_states: [idle, mixed, allocated, completing, planned]
slurm_config:
  SlurmctldHost: localhost
  # Jobs share the node by CPU and memory; Ubuntu 22.04's Slurm 21.08 would
  # otherwise give each job the whole node (select/linear). A job without a
  # memory request gets its CPU's share, so every CPU can run a job.
  SelectType: select/cons_tres
  SelectTypeParameters: CR_CPU_Memory
  DefMemPerCPU: "{{ (_pulsar_slurm_memory_mb | int) // (_pulsar_slurm_cpus | int) }}"
  # Back in service by itself after a reboot or a slurmd restart.
  ReturnToService: 2
  # Without accounting, Slurm forgets a finished job after MinJobAge: four hours, so
  # that Pulsar still gets its state after a restart. More would let the default
  # MaxJobCount (10000 jobs, finished ones included) refuse new jobs on a busy day.
  MinJobAge: 14400
  # Cancelling a job kills its processes, not a Docker container it started
  # (that runs under dockerd); the epilog does. files/epilog.sh.
  Epilog: "{{ pulsar_slurm_epilog if _pulsar_amqp.docker_enabled else omit }}"
  PrologEpilogTimeout: 90
  # Job scripts, job temporary files and the jobs' environment on the storage.
  SlurmdSpoolDir: "{{ pulsar_slurmd_spool_dir }}"
  TmpFS: "{{ pulsar_job_tmp_dir }}"
  TaskProlog: "{{ pulsar_slurm_task_prolog }}"
  TaskEpilog: "{{ pulsar_slurm_task_epilog }}"

# galaxyproject.cvmfs client settings, identical to the SRC Galaxy component.
cvmfs_role: client
galaxy_cvmfs_repos_enabled: true
cvmfs_quota_limit: 8000
galaxy_cvmfs_server_urls:
  - domain: galaxyproject.org
    use_geoapi: true
    urls:
      - "http://cvmfs1-ufr0.galaxyproject.eu/cvmfs/@fqrn@"
      - "http://cvmfs1-psu0.galaxyproject.org/cvmfs/@fqrn@"
# Apptainer apt repository, as in the SRC Galaxy component.
apptainer_repo_url: https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu
apptainer_key_location: /usr/share/keyrings/apptainer.asc
docker_install_compose_plugin: false
docker_install_compose: false
# Images and containers on the storage, too. Docker Engine 29 keeps images in
# containerd's own root (/var/lib/containerd) with the containerd image store, its new
# default; without it, they are below data-root.
docker_daemon_options:
  data-root: "{{ pulsar_docker_data_root }}"
  features:
    containerd-snapshotter: false

# --- Welcome page (SRAM-protected, through SRC-Nginx) -------------------------
pulsar_configure_src_proxy: true
pulsar_welcome_dir: /srv/static
nginx_reverse_proxy_locations:
  # Only the exact root; the page contains the RabbitMQ password.
  - name: pulsar-welcome
    location: '= /'
    auth: sram
    root: "{{ pulsar_welcome_dir }}/"
    try_files: $uri/index.html =404
