# Tool configuration only: this repository is an Ansible playbook, not a Python package.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
# What is measured: the deploy-time broker check, the playbook's filter plugins and the
# test helpers. tests/galaxy_contract/ is a vendored copy of the Galaxy component's parser.
source_dirs = ["files", "filter_plugins", "tests"]
omit = ["tests/test_*.py", "tests/galaxy_contract/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored byte-for-byte from the Galaxy component (checked by tests/test_galaxy_contract.py).
extend-exclude = ["tests/galaxy_contract"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written
"tests/**" = ["S101"]
