---
# Pulsar as an AMQP client of the Galaxy component's RabbitMQ, webless, modelled on
# usegalaxy-eu/pulsar-nemo-login-role with systemd instead of supervisord.
- name: Install Python venv support for Pulsar
  ansible.builtin.apt:
    name: [python3-venv, python3-dev, build-essential, ca-certificates]
    state: present
    update_cache: true

- name: Create the Pulsar system user
  ansible.builtin.user:
    name: "{{ pulsar_user }}"
    system: true
    home: "{{ pulsar_home }}"
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ ['docker'] if pulsar_docker | bool else omit }}"
    append: true

- name: Create Pulsar directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ pulsar_venv | dirname }}", owner: root, mode: '0755'}
    - {path: "{{ pulsar_config_dir }}", owner: root, mode: '0755'}
    - {path: "{{ pulsar_home }}", owner: "{{ pulsar_user }}", mode: '0750'}
    - {path: "{{ pulsar_persistence_dir }}", owner: "{{ pulsar_user }}", mode: '0750'}
    - {path: "{{ _pulsar_amqp.jobs_directory }}", owner: "{{ pulsar_user }}", mode: '0750'}

# No `creates:`, so a version change in group_vars upgrades the venv.
# The amqp extra installs kombu, which Pulsar needs for pyamqp:// message queues.
- name: Install pulsar-app with AMQP support into the venv
  ansible.builtin.pip:
    name:
      - "pulsar-app[amqp]=={{ pulsar_version }}"
      - psutil
    virtualenv: "{{ pulsar_venv }}"
    # Absolute path: SRC runs Ansible through `uv run`, whose own python3 may
    # come first on PATH and is not usable by the pulsar system user.
    virtualenv_command: /usr/bin/python3 -m venv
  notify: Restart Pulsar

- name: Write Pulsar's app.yml with the Galaxy broker connection
  ansible.builtin.template:
    src: templates/pulsar-app.yml.j2
    dest: "{{ pulsar_config_dir }}/app.yml"
    owner: root
    group: "{{ pulsar_user }}"
    mode: '0640'
  no_log: true
  diff: false
  notify: Restart Pulsar

- name: Write Pulsar's logging configuration
  ansible.builtin.copy:
    src: templates/pulsar-server.ini
    dest: "{{ pulsar_config_dir }}/server.ini"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pulsar

- name: Write Pulsar's job metrics configuration
  ansible.builtin.copy:
    dest: "{{ pulsar_config_dir }}/job_metrics_conf.xml"
    owner: root
    group: root
    mode: '0644'
    content: |
      <?xml version="1.0"?>
      <job_metrics>
          <core />
          <cpuinfo />
          <meminfo />
          <hostname />
      </job_metrics>
  notify: Restart Pulsar

- name: Install the broker connection check
  ansible.builtin.copy:
    src: files/check_amqp.py
    dest: "{{ pulsar_check_script }}"
    owner: root
    group: root
    mode: '0755'

- name: Install Apptainer for Singularity-enabled Galaxy environments
  ansible.builtin.include_tasks: tasks/apptainer.yml
  when: pulsar_apptainer | bool

# autofs mounts a repository on first access; this proves the client works
# (keys, stratum 1 reachable) before Galaxy's first job depends on it.
- name: Check that the Galaxy CVMFS repositories mount
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _pulsar_cvmfs_repositories
  failed_when: not _pulsar_cvmfs_repositories.stat.exists
  loop:
    - /cvmfs/data.galaxyproject.org/managed/location/tool_data_table_conf.xml
    - /cvmfs/singularity.galaxyproject.org/all
  when: _pulsar_cvmfs | bool

- name: Install the Pulsar systemd unit
  ansible.builtin.template:
    src: templates/pulsar.service.j2
    dest: /etc/systemd/system/pulsar.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Pulsar

- name: Enable and start Pulsar
  ansible.builtin.systemd:
    name: pulsar
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending Pulsar restarts before checking the connection
  ansible.builtin.meta: flush_handlers

# Pulsar declares and consumes its setup queue when it has logged in; a consumer
# on it proves the login, the vhost and the TLS settings. Exit status 2 means
# "not yet" and is retried; 1 is a configuration error and stops at once.
- name: Check that Pulsar consumes its setup queue on Galaxy's broker
  ansible.builtin.command:
    argv:
      - "{{ pulsar_venv }}/bin/python"
      - "{{ pulsar_check_script }}"
      - "{{ pulsar_config_dir }}/app.yml"
      - "{{ _pulsar_amqp.manager }}"
  register: _pulsar_amqp_check
  until: _pulsar_amqp_check.rc != 2
  retries: 24
  delay: 5
  changed_when: false
  failed_when: false

- name: Fail when Pulsar cannot use Galaxy's broker
  ansible.builtin.fail:
    msg: "{{ _pulsar_amqp_check.stdout | default('', true) }} {{ _pulsar_amqp_check.stderr | default('', true) | trim }}"
  when: _pulsar_amqp_check.rc != 0
