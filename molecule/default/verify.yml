---
# Integration: the deployed Pulsar, its credentials, Slurm and storage. End to end: a job from
# Galaxy's client with the runner byoc-sync writes.
- name: Verify the Pulsar workspace
  hosts: pulsar_workspace
  gather_facts: false
  vars:
    storage: /data/molecule
    pulsar_data: "{{ storage }}/pulsar"
    vhost: "{{ molecule_vhost }}"
  tasks:
    # The deployment's own check: Pulsar's login, vhost and TLS settings, through its code.
    - name: Check that Pulsar consumes its setup queue (check_amqp.py)
      ansible.builtin.command:
        argv: [/opt/pulsar/venv/bin/python, /opt/pulsar/check_amqp.py, /opt/pulsar/config/app.yml]
      register: _check_amqp
      changed_when: false

    - name: Read the broker connection state the deployment recorded
      ansible.builtin.include_tasks: tasks/verify-state.yml
      vars:
        expected_state: connected
        expected_message: "Pulsar consumes pulsar_production__setup in vhost {{ vhost }}"

    - name: Read Pulsar's app.yml
      ansible.builtin.slurp:
        src: /opt/pulsar/config/app.yml
      register: _app_yml
      no_log: true

    - name: Pulsar verifies the broker's certificate and hostname against the system CA bundle
      vars:
        app: "{{ _app_yml.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - app.amqp_connect_ssl_cert_reqs == 'cert_required'
          - app.amqp_connect_ssl_ca_certs == '/etc/ssl/certs/ca-certificates.crt'
          - app.amqp_connect_ssl_server_hostname == 'galaxy.molecule.test'
          - "'ssl' not in app.message_queue_url"
          - app.managers.production.type == 'queued_drmaa'
        quiet: true

    # The given name and password were stored for reruns, root-only (tasks/credentials.yml).
    - name: Find the stored BYOC credentials
      ansible.builtin.stat:
        path: "{{ pulsar_data }}/byoc.json"
      register: _store

    - name: Read the stored BYOC credentials
      ansible.builtin.slurp:
        src: "{{ pulsar_data }}/byoc.json"
      register: _store_content
      no_log: true

    - name: The credentials are stored root-only and are the component parameters
      vars:
        stored: "{{ _store_content.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - _store.stat.isreg
          - _store.stat.pw_name == 'root'
          - _store.stat.mode == '0600'
          - stored.name == pulsar_amqp_name
          - stored.password == pulsar_amqp_password
          - stored | length == 2
        quiet: true
      no_log: true

    - name: Find the container cache and its parents
      ansible.builtin.stat:
        path: "{{ pulsar_data }}/{{ item }}"
      loop: [var, var/database, var/database/container_cache]
      register: _cache_dirs

    # Galaxy's SINGULARITY_CACHEDIR (byoc-sync's destination): the pulsar user's, in root's.
    - name: The container cache is the pulsar user's inside root-owned directories
      ansible.builtin.assert:
        that:
          - _cache_dirs.results | map(attribute='stat.isdir') | list == [true, true, true]
          - _cache_dirs.results | map(attribute='stat.pw_name') | list == ['root', 'root', 'pulsar']
          - _cache_dirs.results | map(attribute='stat.mode') | list == ['0755', '0755', '0750']
        quiet: true

    # The negative case: the same settings with another hostname than the certificate's
    # are refused, so the success above is verification at work.
    - name: Write app.yml with a hostname the certificate does not name
      ansible.builtin.copy:
        dest: /root/app-wrong-hostname.yml
        content: >-
          {{ _app_yml.content | b64decode | from_yaml
             | combine({'amqp_connect_ssl_server_hostname': 'wrong.molecule.test'}) | to_nice_yaml }}
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Check the connection with the wrong hostname
      ansible.builtin.command:
        argv: [/opt/pulsar/venv/bin/python, /opt/pulsar/check_amqp.py, /root/app-wrong-hostname.yml]
      register: _wrong_hostname
      changed_when: false
      failed_when: _wrong_hostname.rc != 1 or 'certificate' not in _wrong_hostname.stdout | lower

    - name: Get the state of the services
      ansible.builtin.command:
        argv: [systemctl, is-active, pulsar, munge, slurmctld, slurmd]
      register: _services
      changed_when: false

    - name: Get the Slurm node's state
      ansible.builtin.command:
        argv: [sinfo, --noheader, --Node, --format, "%T"]
      register: _sinfo
      changed_when: false

    - name: Pulsar, munge, slurmctld and slurmd run, and the node takes jobs
      ansible.builtin.assert:
        that:
          - _services.stdout_lines == ['active', 'active', 'active', 'active']
          - _sinfo.stdout | trim in ['idle', 'mixed', 'allocated']
        quiet: true

    - name: Find the mount of each data directory
      ansible.builtin.command:
        argv: [findmnt, --noheadings, --output, TARGET, --target, "{{ pulsar_data }}/{{ item }}"]
      loop: [staging, persisted_data, home, job_tmp, slurmd, apptainer_cache, apptainer_tmp, var/database/container_cache]
      register: _mounts
      changed_when: false

    - name: Pulsar's data directories are on the storage mount
      ansible.builtin.assert:
        that: item.stdout | trim == storage
        fail_msg: "{{ item.item }} is on {{ item.stdout }}, not on {{ storage }}"
        quiet: true
      loop: "{{ _mounts.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Verify the broker
  hosts: galaxy_workspace
  gather_facts: false
  vars:
    node: "{{ molecule_rabbitmq_node }}"
    vhost: "{{ molecule_vhost }}"
  tasks:
    - name: List the consumers on the Pulsar's vhost
      ansible.builtin.command:
        argv: [rabbitmqctl, -n, "{{ node }}", --quiet, list_consumers, -p, "{{ vhost }}", --no-table-headers, queue_name]
      register: _consumers
      changed_when: false

    - name: List the connections
      ansible.builtin.command:
        argv: [rabbitmqctl, -n, "{{ node }}", --quiet, list_connections, --no-table-headers, user, vhost, ssl]
      register: _connections
      changed_when: false

    - name: Pulsar consumes pulsar_production__setup on its vhost, logged in as its BYOC user over TLS
      ansible.builtin.assert:
        that:
          - "'pulsar_production__setup' in _consumers.stdout_lines | map('trim') | list"
          - "[molecule_mq_user, vhost, 'true'] in _connections.stdout_lines | map('split') | list"
        fail_msg: "consumers: {{ _consumers.stdout_lines }}, connections: {{ _connections.stdout_lines }}"

# A first deployment: the BYOC account does not exist until byoc-sync's pull request is
# merged and deployed. The broker refuses Pulsar's login; the deployment passes and records
# "waiting", and the unit keeps restarting Pulsar (files/pulsar_main.py exits it).
- name: Remove the BYOC account, as before byoc-sync's pull request is merged
  hosts: galaxy_workspace
  gather_facts: false
  vars:
    node: "{{ molecule_rabbitmq_node }}"
  tasks:
    - name: Delete the BYOC user
      ansible.builtin.command:
        argv: [rabbitmqctl, -n, "{{ node }}", --quiet, delete_user, "{{ molecule_mq_user }}"]
      changed_when: true

    - name: Close the deleted user's connections
      ansible.builtin.command:
        argv: [rabbitmqctl, -n, "{{ node }}", --quiet, close_all_user_connections, "{{ molecule_mq_user }}", "account removed"]
      changed_when: true

- name: Deploy without the BYOC account
  ansible.builtin.import_playbook: ../../playbook.yml

- name: Verify the deployment without the account
  hosts: pulsar_workspace
  gather_facts: false
  tasks:
    - name: The deployment recorded "waiting" with the check's message
      ansible.builtin.include_tasks: tasks/verify-state.yml
      vars:
        expected_state: waiting
        expected_message: "refused the login of user {{ molecule_mq_user }}"

    - name: Get the unit's restarts and state
      ansible.builtin.command:
        argv: [systemctl, show, pulsar, --property=NRestarts, --property=ActiveState]
      register: _unit
      changed_when: false

    # Restart=always, StartLimitIntervalSec=0: the unit restarts Pulsar (not failed) after
    # every refused login.
    - name: The unit keeps restarting Pulsar
      ansible.builtin.assert:
        that:
          - "'ActiveState=failed' not in _unit.stdout_lines"
          - _unit.stdout_lines | select('match', '^NRestarts=') | first | split('=') | last | int > 0
        fail_msg: "{{ _unit.stdout_lines }}"

- name: Create the BYOC account, as byoc-sync's merged pull request does
  hosts: galaxy_workspace
  gather_facts: false
  vars:
    node: "{{ molecule_rabbitmq_node }}"
    pulsar: "{{ hostvars['pulsar'] }}"
    vhost: "{{ molecule_vhost }}"
  tasks:
    - name: Create the Pulsar's BYOC user
      ansible.builtin.command:
        argv: [rabbitmqctl, -n, "{{ node }}", --quiet, add_user, "{{ molecule_mq_user }}"]
        stdin: "{{ pulsar.pulsar_amqp_password }}"
      changed_when: true
      no_log: true

    - name: Give the BYOC user its vhost
      ansible.builtin.command:
        argv: [rabbitmqctl, -n, "{{ node }}", --quiet, set_permissions, -p, "{{ vhost }}", "{{ molecule_mq_user }}", ".*", ".*", ".*"]
      changed_when: true

- name: Pulsar connects by itself once the account exists
  hosts: pulsar_workspace
  gather_facts: false
  tasks:
    # The README's command to run the check again; Pulsar's next restart logs in.
    - name: Wait for Pulsar to consume its setup queue
      ansible.builtin.command:
        argv: [/opt/pulsar/venv/bin/python, /opt/pulsar/check_amqp.py, /opt/pulsar/config/app.yml]
      register: _reconnected
      until: _reconnected.rc == 0
      retries: 18
      delay: 5
      changed_when: false

# The rerun after the admins merged: changes nothing but records "connected".
- name: Deploy again with the BYOC account
  ansible.builtin.import_playbook: ../../playbook.yml

- name: Verify the rerun with the account
  hosts: pulsar_workspace
  gather_facts: false
  tasks:
    - name: The rerun recorded "connected"
      ansible.builtin.include_tasks: tasks/verify-state.yml
      vars:
        expected_state: connected
        expected_message: "Pulsar consumes pulsar_production__setup"

- name: Run a job from Galaxy
  hosts: galaxy_workspace
  gather_facts: false
  vars:
    pulsar: "{{ hostvars['pulsar'] }}"
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    ephemeral: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
  tasks:
    # Galaxy's runner and destination for this Pulsar, from byoc-sync's templates and the
    # component parameters (tests/e2e/galaxy_config.py); the password goes into the runner's URL.
    - name: Write the component parameters for Galaxy's job configuration
      ansible.builtin.copy:
        dest: "{{ ephemeral }}/pulsar_params.yml"
        content: "{{ pulsar | dict2items | selectattr('key', 'match', '^pulsar_') | items2dict | to_nice_yaml }}"
        mode: '0600'
      delegate_to: localhost
      no_log: true

    # Not inside the no_log task below, which would hide the traceback.
    - name: Check that the test tooling has an ansible-core that tests/helpers.py supports
      ansible.builtin.assert:
        that: >-
          lookup('env', 'MOLECULE_TESTS_PYTHON') | length > 0
          or ansible_version.full is version('2.19', '<')
        fail_msg: >-
          tests/helpers.py needs requirements-dev.txt's ansible-core 2.18: set MOLECULE_TESTS_PYTHON
          to the python of a virtualenv with requirements-dev.txt.
        quiet: true
      delegate_to: localhost

    - name: Render Galaxy's runner and destination for this Pulsar
      ansible.builtin.command:
        argv:
          # requirements-dev.txt's Python (MOLECULE_TESTS_PYTHON in CI): tests/helpers.py needs
          # its ansible-core, which may not be the one running this playbook.
          - "{{ lookup('env', 'MOLECULE_TESTS_PYTHON') | default(ansible_playbook_python, true) }}"
          - -m
          - tests.e2e.galaxy_config
          - "{{ ephemeral }}/pulsar_params.yml"
          - "{{ molecule_galaxy_url }}"
        chdir: "{{ project }}"
      delegate_to: localhost
      register: _galaxy_job_config
      changed_when: false
      no_log: true

    - name: Install Galaxy's job configuration
      ansible.builtin.copy:
        dest: /opt/galaxy-client/job.json
        content: "{{ _galaxy_job_config.stdout }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Run a job from Galaxy's client through the broker
      ansible.builtin.command:
        argv:
          - /opt/galaxy-client/venv/bin/python
          - /opt/galaxy-client/galaxy_job.py
          - /opt/galaxy-client/job.json
          - --timeout
          - "600"
      register: _galaxy_job
      changed_when: false
      failed_when: false

    - name: Show what Galaxy received
      ansible.builtin.debug:
        msg: "{{ _galaxy_job.stdout_lines + _galaxy_job.stderr_lines[-30:] }}"

    # Through Slurm (DRMAA) as the pulsar user, in staging on the storage; outputs back over
    # HTTP; status updates before the final one.
    - name: The job completed through Slurm on the storage and its outputs arrived
      vars:
        result: "{{ _galaxy_job.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - _galaxy_job.rc == 0
          - result.status == 'complete'
          - result.returncode == 0
          - "'running' in result.states"
          - result.inputs_served >= 1
          - result.received.output == "galaxy\npulsar\nrabbitmq\n"
          - result.report.user == 'pulsar'
          - result.report.slurm_job != 'none'
          - result.report.cwd.startswith(pulsar.pulsar_storage_path ~ '/staging/' ~ result.job_id ~ '/')

# A broker that cannot be reached is an error: the deployment fails with the check's message
# and records "error". Run from the controller, as an imported play could not be allowed to
# fail. An unresolvable host: a dropped connection would be retried for two minutes first.
- name: Deploy against an unreachable broker host
  hosts: pulsar_workspace
  gather_facts: false
  vars:
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: Run the playbook with a broker host that does not resolve
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
          - -i
          - "{{ ansible_inventory_sources | first }}"
          - playbook.yml
          - -e
          - pulsar_amqp_host=nowhere.molecule.test
        chdir: "{{ project }}"
      delegate_to: localhost
      register: _unreachable
      changed_when: true
      failed_when: _unreachable.rc == 0 or 'Cannot resolve nowhere.molecule.test' not in _unreachable.stdout

    - name: The deployment recorded "error" with the check's message
      ansible.builtin.include_tasks: tasks/verify-state.yml
      vars:
        expected_state: error
        expected_message: "Cannot resolve nowhere.molecule.test"
