---
# Defaults for SRC component parameters (strings, as SRC passes them). Each one
# matches a value of this Pulsar's entry in the Galaxy component's
# src_galaxy_pulsar_amqp_configs (mirelaminkova/src-component-galaxy-amqp).
# Galaxy workspace hostname, e.g. galaxy.example.org (no https://). Required.
pulsar_galaxy_fqdn: ""
# Galaxy's src_galaxy_rabbitmq_port.
pulsar_amqp_port: "5671"
# The entry's name. Required.
pulsar_amqp_name: ""
# The entry's password: at least 12 of A-Z a-z 0-9 . _ ~ -. Required; mark it as secret.
pulsar_amqp_password: ""
# The entry's manager.
pulsar_manager: _default_
# The workspace's attached storage volume: its mount point /data/<volume name> (Pulsar then
# uses /data/<volume name>/pulsar) or a directory on it. Required. Pulsar keeps all its data
# there; the entry's jobs_directory is <storage directory>/staging.
pulsar_storage_path: ""
# Mount the Galaxy CVMFS repositories (reference data). "false" leaves CVMFS out.
pulsar_cvmfs: "true"
# "false" leaves Apptainer out; the Galaxy entry then has no singularity_enabled.
pulsar_apptainer: "true"
# "true" installs Docker and adds the pulsar user to the docker group (root-equivalent).
pulsar_docker: "false"
# "slurm" runs jobs through Slurm (DRMAA) on this workspace; "local" in Pulsar itself.
pulsar_job_runner: slurm
