services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management}
    # The node name (rabbit@<hostname>) selects the data directory in the volume;
    # a fixed hostname keeps queues and messages across container recreation.
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      # Plain AMQP and the management UI on the loopback only. Remote clients
      # (Galaxy) use AMQPS on 5671, terminated by nginx with the workspace certificate.
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./.secrets/rabbitmq.conf:/etc/rabbitmq/conf.d/90-pulsar.conf:ro
      - ./.secrets/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  rabbitmq-data:
