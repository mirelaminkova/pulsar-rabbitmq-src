# Generated by Ansible (pulsar-rabbitmq-src). Logging only, no [app:main].
# pulsar-main applies no logging configuration for --app_conf_path alone, so
# without this file only warnings reach the journal. With --ini_path, Pulsar
# 0.15.x loads app.yml from this file's directory.
[loggers]
keys = root, pulsar, kombu

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pulsar]
level = INFO
handlers = console
qualname = pulsar
propagate = 0

[logger_kombu]
level = WARN
handlers = console
qualname = kombu
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s
