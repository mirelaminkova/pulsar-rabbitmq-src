---
- name: Install Pulsar with RabbitMQ on SURF Research Cloud
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}"
  become: true
  pre_tasks:
    - name: Validate component parameters
      ansible.builtin.assert:
        that:
          - rabbitmq_install_dir is match('^/[A-Za-z0-9_./-]+$')
          - rabbitmq_welcome_dir is match('^/[A-Za-z0-9_./-]+$')
          - rabbitmq_hostname is match('^[A-Za-z0-9.-]+$')
          - rabbitmq_vhost is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
          - rabbitmq_pair_username is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,49}$')
          - rabbitmq_admin_username is match('^[A-Za-z0-9][A-Za-z0-9._-]{2,49}$')
          - (rabbitmq_pair_password | default('', true) | length == 0) or
            (rabbitmq_pair_password is match('^[A-Za-z0-9._~-]{16,128}$'))
          - rabbitmq_amqps_port | string is match('^[0-9]{3,5}$')
          - pulsar_manager is match('^[A-Za-z0-9_][A-Za-z0-9._-]{0,63}$')
          - (pulsar_amqp_key_prefix | default('', true) | length == 0) or
            (pulsar_amqp_key_prefix is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'))
          - _pulsar_root is match('^/[A-Za-z0-9_./-]+$')
        fail_msg: >-
          Check the component parameters: paths, hostname, vhost, usernames (3-50 of A-Z a-z 0-9 . _ -),
          pair password (empty, or 16-128 of A-Z a-z 0-9 . _ ~ -), AMQPS port (digits),
          Pulsar manager and key prefix (A-Z a-z 0-9 . _ -), and pulsar_root (empty, or an absolute path).

    - name: Check supported workspace OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in ['22.04', '24.04']
        fail_msg: Choose an Ubuntu 22.04 or 24.04 SRC workspace.

    - name: Check SRC nginx prerequisite
      ansible.builtin.stat:
        path: /etc/nginx/app-location-conf.d/authentication.conf
      register: _rabbitmq_nginx_prerequisite
      when: rabbitmq_configure_src_proxy | bool

    - name: Require SRC-Nginx before this component
      ansible.builtin.assert:
        that: _rabbitmq_nginx_prerequisite.stat.exists
        fail_msg: Add SRC-Nginx before this component in the catalog item.
      when: rabbitmq_configure_src_proxy | bool

  roles:
    - geerlingguy.docker
    # Galaxy's CVMFS repositories (reference data and Singularity images under
    # /cvmfs), with the same role and settings as the SRC Galaxy component, so
    # both ends of a job see the same paths.
    - role: galaxyproject.cvmfs
      when: _pulsar_cvmfs | bool

  tasks:
    - name: Create the deployment directories
      ansible.builtin.file:
        path: "{{ rabbitmq_install_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: ['', scripts]

    - name: Copy deployment files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ rabbitmq_install_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - compose.yml
        - scripts/configure.py

    - name: Generate and retain RabbitMQ credentials and configuration
      ansible.builtin.command:
        argv:
          - python3
          - "{{ rabbitmq_install_dir }}/scripts/configure.py"
          - --directory
          - "{{ rabbitmq_install_dir }}"
          - --pair-username
          - "{{ rabbitmq_pair_username }}"
          - --admin-username
          - "{{ rabbitmq_admin_username }}"
          - --vhost
          - "{{ rabbitmq_vhost }}"
          - --amqp-port
          - "{{ rabbitmq_amqp_port | string }}"
          - --management-port
          - "{{ rabbitmq_management_port | string }}"
          - --consumer-timeout-ms
          - "{{ rabbitmq_consumer_timeout_ms | string }}"
          - --management-path-prefix
          - "{{ rabbitmq_management_path if rabbitmq_management_ui | bool else '' }}"
          - --manager
          - "{{ pulsar_manager }}"
          - --amqp-key-prefix
          - "{{ pulsar_amqp_key_prefix | default('', true) }}"
          - "{{ '--acknowledge' if pulsar_amqp_acknowledge | bool else '--' }}"
      environment:
        RABBITMQ_PAIR_PASSWORD: "{{ rabbitmq_pair_password | default('', true) }}"
      register: _rabbitmq_configuration
      changed_when: _rabbitmq_configuration.stdout == 'changed'
      no_log: true

    - name: Start RabbitMQ
      community.docker.docker_compose_v2:
        project_src: "{{ rabbitmq_install_dir }}"
        project_name: pulsar-rabbitmq
        state: present
        pull: missing
        # Definitions (users, vhost, permissions) are imported when the broker starts.
        recreate: "{{ 'always' if _rabbitmq_configuration.changed else 'auto' }}"
        wait: true
        wait_timeout: 300
      environment:
        RABBITMQ_IMAGE: "{{ rabbitmq_image }}"

    - name: Read deployment secrets without logging them
      ansible.builtin.slurp:
        src: "{{ rabbitmq_install_dir }}/secrets.json"
      register: _rabbitmq_secrets_file
      no_log: true

    - name: Check that the pair account has its permissions on the Pulsar vhost
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ rabbitmq_management_port }}{{ _rabbitmq_api_prefix }}/api/permissions/{{ rabbitmq_vhost | urlencode }}/{{ rabbitmq_pair_username | urlencode }}"
        url_username: "{{ rabbitmq_admin_username }}"
        url_password: "{{ (_rabbitmq_secrets_file.content | b64decode | from_json).RABBITMQ_ADMIN_PASSWORD }}"
        force_basic_auth: true
        status_code: [200, 404]
      vars:
        _rabbitmq_api_prefix: "{{ rabbitmq_management_path if rabbitmq_management_ui | bool else '' }}"
      register: _rabbitmq_permissions
      # 404 or a refused connection while the definitions are still being imported.
      until: _rabbitmq_permissions.status == 200
      retries: 24
      delay: 5
      no_log: true

    - name: Configure the public AMQPS listener and the welcome page
      ansible.builtin.include_tasks: tasks/nginx.yml
      when: rabbitmq_configure_src_proxy | bool

    - name: Install Pulsar, consuming from RabbitMQ
      ansible.builtin.include_tasks: tasks/pulsar.yml

  handlers:
    - name: Restart Pulsar
      ansible.builtin.systemd:
        name: pulsar
        state: restarted
        daemon_reload: true
